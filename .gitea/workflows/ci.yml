name: CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  smoke-test-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_NAME: git.0xmax42.io/maxp/reactive-plantuml
      TAG_NAME: test
      OCI_CACHE_REGISTRY: oci-cache.git.0xmax42.io
      OCI_CACHE_AUDIENCE: oci_cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          set -euo pipefail

          apt-get update -qq
          apt-get install -qq --no-install-recommends -y \
            ca-certificates \
            curl \
            jq \
            make \
            podman

      - name: Configure OCI cache authentication
        uses: https://git.0xmax42.io/actions/oidc-token-action@v0
        with:
          mode: registry-credential-helper
          audience: ${{ env.OCI_CACHE_AUDIENCE }}
          registry: ${{ env.OCI_CACHE_REGISTRY }}

      - name: Build AMD64 image with Podman
        run: |
          set -euo pipefail

          cache="${OCI_CACHE_REGISTRY}/cache/${GITHUB_REPOSITORY,,}/amd64"

          podman build \
            --platform linux/amd64 \
            --file Dockerfile \
            --layers \
            --cache-from "${cache}" \
            --cache-to "${cache}" \
            --tag "${IMAGE_NAME}:${TAG_NAME}" \
            .

      - name: Test image (smoke test)
        env:
          IMAGE_TAG: ${{ env.TAG_NAME }}
        run: |
          set -euo pipefail

          make test
